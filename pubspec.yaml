name: kosmico
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  google_mlkit_image_labeling: ^0.15.0
  http: ^1.2.0
  http_parser: ^4.0.2
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  intl: ^0.20.2
  flutter_map: ^8.0.0
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  razorpay_flutter: ^1.3.16
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  flutter_contacts: ^2.3.1
  pdf: ^3.11.1
  printing: ^5.13.2
  google_generative_ai: ^0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/kosmicologo.png"
  min_sdk_android: 21 # android min sdk min:16, default:21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
