name: kosmico
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.0.7
  device_preview: ^1.1.0
  http: ^1.1.0
  http_parser: ^4.0.2
  shared_preferences: ^2.2.2
  provider: ^6.1.2
  intl: ^0.20.2
  flutter_map: ^8.0.0
  latlong2: ^0.10.1
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  razorpay_flutter: ^1.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/kosmicologo.png"
  min_sdk_android: 21 # android min sdk min:16, default:21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
